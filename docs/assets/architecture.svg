<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 780" width="900" height="780" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background -->
  <rect width="900" height="780" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" fill="#e6edf3" font-size="18" font-weight="bold">Multi-Agent Architecture</text>

  <!-- Developer opens PR -->
  <rect x="320" y="58" width="260" height="44" rx="8" fill="#1f6feb" opacity="0.18" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="450" y="84" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="600">Developer opens PR (human only)</text>

  <!-- Arrow down to Benchmark Agent -->
  <line x1="450" y1="102" x2="450" y2="126" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Benchmark Agent Box -->
  <rect x="170" y="126" width="560" height="80" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <text x="450" y="155" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Benchmark Agent (Hub / Orchestrator)</text>
  <text x="450" y="174" text-anchor="middle" fill="#8b949e" font-size="12">Single entry point · Coordinates agents + loop engine</text>
  <text x="450" y="192" text-anchor="middle" fill="#8b949e" font-size="11">Code review · PR feedback · Pipeline guidance · Guardrail Q&amp;A</text>

  <!-- Three arrows down from Benchmark Agent -->
  <line x1="290" y1="206" x2="230" y2="256" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="450" y1="206" x2="450" y2="256" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>
  <line x1="610" y1="206" x2="670" y2="256" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arrowBlue)"/>

  <!-- Guardrail Enforcement Agent -->
  <rect x="60" y="256" width="190" height="90" rx="8" fill="#161b22" stroke="#da3633" stroke-width="2"/>
  <text x="155" y="282" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="700">Guardrail Enforcement</text>
  <text x="155" y="298" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="700">Agent</text>
  <text x="155" y="316" text-anchor="middle" fill="#8b949e" font-size="11">OPA · 34 rules</text>
  <text x="155" y="332" text-anchor="middle" fill="#8b949e" font-size="11">Policy enforcement</text>

  <!-- Pi Guardrail Agent -->
  <rect x="355" y="256" width="190" height="90" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="2"/>
  <text x="450" y="282" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">Pi Guardrail Agent</text>
  <text x="450" y="300" text-anchor="middle" fill="#8b949e" font-size="11">10 rules</text>
  <text x="450" y="318" text-anchor="middle" fill="#8b949e" font-size="11">Bash security</text>
  <text x="450" y="334" text-anchor="middle" fill="#8b949e" font-size="11">Code standards</text>

  <!-- Research Agent -->
  <rect x="650" y="256" width="190" height="90" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="745" y="282" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">Research Agent</text>
  <text x="745" y="300" text-anchor="middle" fill="#8b949e" font-size="11">Schedule only</text>
  <text x="745" y="318" text-anchor="middle" fill="#8b949e" font-size="11">Threat intelligence</text>
  <text x="745" y="334" text-anchor="middle" fill="#8b949e" font-size="11">Policy gap analysis</text>

  <!-- Arrows down to Loop Engine -->
  <line x1="155" y1="346" x2="340" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="450" y1="346" x2="450" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <line x1="745" y1="346" x2="560" y2="420" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <!-- Loop Engine Box -->
  <rect x="130" y="420" width="640" height="140" rx="8" fill="#161b22" stroke="#d29922" stroke-width="2"/>
  <text x="450" y="446" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="700">Loop Engine</text>
  <text x="450" y="466" text-anchor="middle" fill="#8b949e" font-size="12">FAIL → AI Auto-Fix → Re-evaluate · Max 3 attempts per violation</text>

  <!-- Loop Engine sub-boxes -->
  <rect x="155" y="478" width="160" height="64" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="235" y="498" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="600">Harness Loop</text>
  <text x="235" y="514" text-anchor="middle" fill="#8b949e" font-size="10">PG/CS/CC/DV</text>
  <text x="235" y="530" text-anchor="middle" fill="#8b949e" font-size="10">9 fix types</text>

  <rect x="370" y="478" width="160" height="64" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="450" y="498" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="600">Pi Loop</text>
  <text x="450" y="514" text-anchor="middle" fill="#8b949e" font-size="10">PI-001+</text>
  <text x="450" y="530" text-anchor="middle" fill="#8b949e" font-size="10">8 fix types</text>

  <rect x="585" y="478" width="160" height="64" rx="6" fill="#0d1117" stroke="#d29922" stroke-width="1"/>
  <text x="665" y="498" text-anchor="middle" fill="#e3b341" font-size="11" font-weight="600">Research Loop</text>
  <text x="665" y="514" text-anchor="middle" fill="#8b949e" font-size="10">.rego syntax</text>
  <text x="665" y="530" text-anchor="middle" fill="#8b949e" font-size="10">3 fix types</text>

  <!-- PASS / ESCALATE arrows -->
  <line x1="340" y1="560" x2="240" y2="612" stroke="#3fb950" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <line x1="560" y1="560" x2="660" y2="612" stroke="#da3633" stroke-width="1.8" marker-end="url(#arrowRed)"/>

  <!-- PASS label -->
  <text x="265" y="592" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="600">PASS</text>
  <!-- ESCALATE label -->
  <text x="636" y="592" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="600">ESCALATE (3 fails)</text>

  <!-- Auto-fix box -->
  <rect x="100" y="612" width="190" height="64" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.8"/>
  <text x="195" y="636" text-anchor="middle" fill="#7ee787" font-size="12" font-weight="700">Auto-fix committed</text>
  <text x="195" y="654" text-anchor="middle" fill="#8b949e" font-size="11">to branch + loop</text>
  <text x="195" y="670" text-anchor="middle" fill="#8b949e" font-size="11">summary as PR comment</text>

  <!-- GitHub Issue box -->
  <rect x="610" y="612" width="190" height="64" rx="8" fill="#161b22" stroke="#da3633" stroke-width="1.8"/>
  <text x="705" y="636" text-anchor="middle" fill="#ff7b72" font-size="12" font-weight="700">GitHub Issue</text>
  <text x="705" y="654" text-anchor="middle" fill="#8b949e" font-size="11">+ PR comment</text>
  <text x="705" y="670" text-anchor="middle" fill="#8b949e" font-size="11">+ loop history</text>

  <!-- Schedule bar -->
  <rect x="60" y="710" width="780" height="52" rx="8" fill="#161b22" stroke="#388bfd" stroke-width="1.5"/>
  <text x="450" y="730" text-anchor="middle" fill="#79c0ff" font-size="12" font-weight="700">GitHub Actions Schedules</text>
  <text x="450" y="750" text-anchor="middle" fill="#8b949e" font-size="11">Every Monday 08:00 UTC → Research Agent · Every 12 hours → Health Check · Every human PR open/update → Loop Engine</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#8b949e"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3fb950"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#da3633"/>
    </marker>
  </defs>
</svg>
