<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Guardrails Hub flow</title>
  <desc id="desc">Pull requests and Rego policies feed the Loop Engine. Threat feeds feed the weekly research scan. Both produce reports for human review, and approved updates return to the policies.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c4b5fd"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { fill: #f8fafc; font-size: 16px; font-weight: 600; }
      .sub { fill: #cbd5e1; font-size: 12px; }
      .tag { fill: #94a3b8; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .loop { fill: none; stroke: #c4b5fd; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect width="960" height="400" rx="20" fill="url(#bg)"/>

  <text x="40" y="44" class="label" font-size="20">AI Agent Guardrails Hub</text>
  <text x="40" y="66" class="sub">Policy-as-code for CI/CD and coding agents</text>

  <text x="40" y="96" class="tag">INPUTS</text>
  <text x="340" y="96" class="tag">AUTOMATION</text>
  <text x="700" y="96" class="tag">OUTCOME</text>

  <!-- Flows -->
  <path class="flow" d="M240 136 C290 136 290 156 336 156" marker-end="url(#arrow)"/>
  <path class="flow" d="M240 216 C290 216 290 184 336 184" marker-end="url(#arrow)"/>
  <path class="flow" d="M240 322 H336" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 170 C640 170 640 218 696 218" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 322 C640 322 640 258 696 258" marker-end="url(#arrow)"/>
  <path class="loop" d="M810 284 V382 H20 V216 H36" marker-end="url(#arrowAccent)"/>
  <rect x="352" y="372" width="196" height="20" rx="10" fill="#0b1120"/>
  <text x="450" y="386" class="sub" text-anchor="middle" fill="#c4b5fd">Approved policy updates</text>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect class="card" x="40" y="108" width="200" height="56" rx="14"/>
    <rect class="card" x="40" y="188" width="200" height="56" rx="14"/>
    <rect class="card" x="40" y="294" width="200" height="56" rx="14"/>
  </g>
  <text x="62" y="133" class="label">Pull request</text>
  <text x="62" y="152" class="sub">Pipeline YAML · agent activity</text>
  <text x="62" y="213" class="label">Rego policies</text>
  <text x="62" y="232" class="sub">44 rules + 31 drafts</text>
  <text x="62" y="319" class="label">Threat feeds</text>
  <text x="62" y="338" class="sub">NVD · CISA KEV</text>

  <!-- Automation -->
  <g filter="url(#shadow)">
    <rect x="340" y="120" width="240" height="100" rx="16" fill="url(#engine)" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="340" y="290" width="240" height="64" rx="16" fill="url(#engine)" stroke="#2dd4bf" stroke-width="1.5"/>
  </g>
  <text x="364" y="150" class="label">Loop Engine</text>
  <text x="364" y="172" class="sub" fill="#ccfbf1">Evaluate → fix → retry</text>
  <text x="364" y="196" class="sub" fill="#99f6e4">Severity-based retry budget</text>
  <text x="364" y="318" class="label">Research scan</text>
  <text x="364" y="338" class="sub" fill="#ccfbf1">Weekly gap analysis</text>

  <!-- Outcome -->
  <rect x="700" y="194" width="220" height="90" rx="16" fill="url(#human)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="724" y="226" class="label">Human review</text>
  <text x="724" y="248" class="sub" fill="#ede9fe">PR reports · escalations</text>
  <text x="724" y="267" class="sub" fill="#ede9fe">Gap issues</text>
</svg>
