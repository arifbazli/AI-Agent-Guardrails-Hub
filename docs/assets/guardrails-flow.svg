<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">AI Agent Guardrails Hub flow</title>
  <desc id="desc">Live: pull requests and Rego policies feed Policy CI and the fail-closed Loop Engine; threat feeds feed the weekly research scan; all results go to human review. Roadmap: research findings flow through triage, drafter, verifier, reviewer and warning-only agents before a human promotes a rule.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#155e75"/>
    </linearGradient>
    <linearGradient id="human" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d28d9"/>
      <stop offset="1" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .label { fill: #f8fafc; font-size: 16px; font-weight: 600; }
      .sub { fill: #cbd5e1; font-size: 12px; }
      .tag { fill: #94a3b8; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; }
      .flow { fill: none; stroke: #94a3b8; stroke-width: 2; }
      .plan { fill: none; stroke: #f59e0b; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .pill { fill: #1c1917; stroke: #f59e0b; stroke-width: 1.2; stroke-dasharray: 4 3; }
      .pilltext { fill: #fde68a; font-size: 13px; font-weight: 600; }
    </style>
  </defs>

  <rect width="960" height="500" rx="20" fill="url(#bg)"/>

  <text x="40" y="44" class="label" font-size="20">AI Agent Guardrails Hub</text>
  <text x="40" y="66" class="sub">Policy-as-code guardrails for CI/CD and coding agents</text>

  <!-- Status chips -->
  <rect x="664" y="30" width="122" height="26" rx="13" fill="#052e2b" stroke="#2dd4bf"/>
  <text x="725" y="47" class="sub" text-anchor="middle" fill="#99f6e4">● Live</text>
  <rect x="798" y="30" width="122" height="26" rx="13" fill="#1c1917" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="859" y="47" class="sub" text-anchor="middle" fill="#fde68a">◌ Roadmap</text>

  <text x="40" y="104" class="tag">INPUTS</text>
  <text x="300" y="104" class="tag">AUTOMATION · FAIL-CLOSED</text>
  <text x="680" y="104" class="tag">OUTCOME</text>

  <!-- Live flows -->
  <path class="flow" d="M220 144 H296" marker-end="url(#arrow)"/>
  <path class="flow" d="M220 144 C258 144 258 216 296 216" marker-end="url(#arrow)"/>
  <path class="flow" d="M220 224 C258 224 258 228 296 228" marker-end="url(#arrow)"/>
  <path class="flow" d="M220 304 H296" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 142 C630 142 630 200 676 200" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 222 H676" marker-end="url(#arrow)"/>
  <path class="flow" d="M580 304 C630 304 630 248 676 248" marker-end="url(#arrow)"/>

  <!-- Inputs -->
  <g filter="url(#shadow)">
    <rect class="card" x="40" y="116" width="180" height="56" rx="14"/>
    <rect class="card" x="40" y="196" width="180" height="56" rx="14"/>
    <rect class="card" x="40" y="276" width="180" height="56" rx="14"/>
  </g>
  <text x="60" y="141" class="label">Pull request</text>
  <text x="60" y="160" class="sub">YAML · agent activity</text>
  <text x="60" y="221" class="label">Rego policies</text>
  <text x="60" y="240" class="sub">44 rules · 31 drafts</text>
  <text x="60" y="301" class="label">Threat feeds</text>
  <text x="60" y="320" class="sub">NVD · CISA KEV</text>

  <!-- Automation -->
  <g filter="url(#shadow)">
    <rect x="300" y="116" width="280" height="56" rx="14" fill="url(#engine)" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="300" y="190" width="280" height="68" rx="14" fill="url(#engine)" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="300" y="276" width="280" height="56" rx="14" fill="url(#engine)" stroke="#2dd4bf" stroke-width="1.5"/>
  </g>
  <text x="320" y="141" class="label">Policy CI</text>
  <text x="320" y="160" class="sub" fill="#ccfbf1">opa check · 199 tests · engine specs</text>
  <text x="320" y="215" class="label">Loop Engine</text>
  <text x="320" y="234" class="sub" fill="#ccfbf1">Evaluate → fix → retry</text>
  <text x="320" y="250" class="sub" fill="#99f6e4">PR-scoped · never edits policies</text>
  <text x="320" y="301" class="label">Research scan</text>
  <text x="320" y="320" class="sub" fill="#ccfbf1">Weekly gap analysis</text>

  <!-- Outcome -->
  <rect x="680" y="168" width="240" height="110" rx="16" fill="url(#human)" stroke="#c4b5fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="702" y="202" class="label">Human review</text>
  <text x="702" y="226" class="sub" fill="#ede9fe">PR reports · escalations</text>
  <text x="702" y="246" class="sub" fill="#ede9fe">Gap issues · rule approval</text>

  <!-- Roadmap lane -->
  <path class="plan" d="M440 332 V356 H124 V400" marker-end="url(#arrowMuted)"/>
  <text x="920" y="378" class="tag" text-anchor="end">ROADMAP · MULTI-AGENT</text>
  <rect x="40" y="388" width="880" height="80" rx="16" fill="none" stroke="#44403c" stroke-width="1.2" stroke-dasharray="6 5"/>

  <g>
    <rect class="pill" x="60" y="404" width="128" height="46" rx="23"/>
    <text x="124" y="432" class="pilltext" text-anchor="middle">Triage</text>
    <rect class="pill" x="202" y="404" width="128" height="46" rx="23"/>
    <text x="266" y="432" class="pilltext" text-anchor="middle">Drafter</text>
    <rect class="pill" x="344" y="404" width="128" height="46" rx="23"/>
    <text x="408" y="432" class="pilltext" text-anchor="middle">Verifier</text>
    <rect class="pill" x="486" y="404" width="128" height="46" rx="23"/>
    <text x="550" y="432" class="pilltext" text-anchor="middle">Reviewer</text>
    <rect class="pill" x="628" y="404" width="128" height="46" rx="23"/>
    <text x="692" y="432" class="pilltext" text-anchor="middle">Warn-only</text>
    <rect class="pill" x="770" y="404" width="128" height="46" rx="23"/>
    <text x="834" y="432" class="pilltext" text-anchor="middle">Promote</text>
  </g>
  <g class="plan">
    <path d="M188 427 H200" marker-end="url(#arrowMuted)"/>
    <path d="M330 427 H342" marker-end="url(#arrowMuted)"/>
    <path d="M472 427 H484" marker-end="url(#arrowMuted)"/>
    <path d="M614 427 H626" marker-end="url(#arrowMuted)"/>
    <path d="M756 427 H768" marker-end="url(#arrowMuted)"/>
  </g>
</svg>
